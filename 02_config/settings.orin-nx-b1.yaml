# B1 integration profile; fixed serial FP32 baseline, acceptance still pending.
llm:
  model: assistant-vlm
  base_url: http://127.0.0.1:8088
  backend: openai
  max_tokens: 128
  context_tokens: 2048
  temperature: 0.0
  chat_template_kwargs:
    enable_thinking: false
  system_prompt: 你是本机的中文陪伴助手。请简短、准确地回答，不编造未观察到的事实。
  system_prompt_no_rag: 你是本机的中文陪伴助手。请简短、准确地回答。
vision:
  width: 640
  height: 480
  frames: 1
  system_prompt: 根据本次提供的画面，用中文简短回答；看不清时明确说明。
  few_shot: []
  camera_device: /dev/v4l/by-id/usb-Intel_R__RealSense_TM__Depth_Camera_435i_Intel_R__RealSense_TM__Depth_Camera_435i_253843064464-video-index0
  stale_after: 1.5
  buffer_bytes_limit: 16777216
  backend: realsense
audio:
  input_device: ReSpeaker Lite
  output_device: null
web:
  host: 127.0.0.1
  port: 8090
face:
  enabled: true
  fps: 5.0
  stable_frames: 2
vad:
  chunk_ms: 32
actions:
  enabled: true
perception:
  backend: tensorrt_b1
  body_threshold: 0.25
  max_people: 10
  max_pose_people: 1
  max_face_targets: 2
  max_object_targets: 1
  fps: 5.0
gestures:
  event_ttl_seconds: 1.5
  max_gap_seconds: 0.9
